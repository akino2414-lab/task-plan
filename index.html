    <script>
      // Vite HMR WebSocket error suppression for preview/mobile environments
      (function() {
        function isViteWsError(target) {
          if (!target) return false;
          try {
            var msg = '';
            if (typeof target === 'string') msg = target;
            else if (target.reason) {
              msg = (target.reason.message || target.reason.stack || String(target.reason)) + '';
            } else if (target.message) {
              msg = (target.message || target.stack || String(target)) + '';
            } else if (target.error) {
              msg = (target.error.message || target.error.stack || String(target.error)) + '';
            } else {
              msg = String(target);
            }
            return /websocket|vite|failed to connect/i.test(msg);
          } catch(e) {
            return false;
          }
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason) || isViteWsError(event)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
            return false;
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isViteWsError(event.message) || isViteWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
    <style>
      vite-error-overlay { display: none !important; }
    </style>
